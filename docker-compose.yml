services:
  postgres:
    image: postgres:16
    container_name: bridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bridge
    ports:
      - "11001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: bridge-adminer
    restart: unless-stopped
    ports:
      - "11002:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
