[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxpy"
version = "0.1.0"
description = "Unified Python SDK for MAX messenger (Green-API REST + Internal TCP/WebSocket API)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MaxPy Contributors", email = "support@maxpy.dev"}
]
keywords = [
    "max",
    "messenger",
    "api",
    "sdk",
    "green-api",
    "chat",
    "bot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "aiofiles>=23.0",
    "python-socks>=2.4",
    "msgpack>=1.0",
    "zstandard>=0.22",
    "lz4>=4.3",
    "aiosqlite>=0.19",
    "tenacity>=8.2",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "types-aiofiles>=23.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]
tinytag = [
    "tinytag>=1.9",
]

[project.urls]
Homepage = "https://github.com/maxpy/maxpy"
Repository = "https://github.com/maxpy/maxpy"
Issues = "https://github.com/maxpy/maxpy/issues"
Documentation = "https://maxpy.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxpy*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long
    "ARG001", # unused argument
    "ARG002", # unused argument
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["maxpy"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]